<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>红歌快闪活动报名系统</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>🎤 红歌快闪活动报名系统</h1>
        <p class="subtitle">重温红色经典 · 传承革命精神</p>
        <nav class="tabs">
          <button class="tab-btn active" data-tab="activities">活动列表</button>
          <button class="tab-btn" data-tab="query">我的报名</button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section id="tab-activities" class="tab-content active">
        <div class="filter-bar">
          <label>活动状态：</label>
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="筹备">筹备中</option>
            <option value="报名中">报名中</option>
            <option value="名单已定">名单已定</option>
            <option value="已举办">已举办</option>
          </select>
        </div>
        <div id="activityList" class="activity-list"></div>
      </section>

      <section id="tab-query" class="tab-content">
        <div class="query-box">
          <h2>查询我的报名</h2>
          <div class="form-row">
            <label>姓名</label>
            <input type="text" id="queryName" placeholder="请输入您的姓名" />
          </div>
          <div class="form-row">
            <label>手机号</label>
            <input
              type="tel"
              id="queryPhone"
              placeholder="请输入报名时的手机号"
            />
          </div>
          <button class="btn btn-primary" onclick="queryMyRegistrations()">
            查询
          </button>
        </div>
        <div id="queryResult"></div>
      </section>
    </main>

    <div id="activityModal" class="modal">
      <div class="modal-content modal-lg">
        <span class="close" onclick="closeModal('activityModal')">&times;</span>
        <div id="activityDetail"></div>
      </div>
    </div>

    <div id="registerModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('registerModal')">&times;</span>
        <h2 id="registerTitle">报名</h2>
        <div class="form-row">
          <label>角色</label>
          <div id="roleDisplay"></div>
        </div>
        <div class="form-row">
          <label>姓名 *</label>
          <input type="text" id="regName" placeholder="请输入您的姓名" />
        </div>
        <div class="form-row">
          <label>手机号 *</label>
          <input type="tel" id="regPhone" placeholder="请输入手机号" />
        </div>
        <div style="text-align: right; margin-top: 20px">
          <button class="btn btn-default" onclick="closeModal('registerModal')">
            取消
          </button>
          <button class="btn btn-primary" onclick="submitRegistration()">
            提交报名
          </button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/app.js"></script>
  </body>
</html>
